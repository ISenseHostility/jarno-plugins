<svg xmlns="http://www.w3.org/2000/svg" width="760" height="344" viewBox="0 0 760 344" role="img" aria-label="A design debate's result with sample data: two sides compared on core argument, best for, biggest risk, cost to switch later and rebuttal, then where they agree and the deciding question">
  <style>
    text { font-family: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace; font-size: 13px; fill: #DCDFE4; white-space: pre; }
    .h { font-weight: 700; }
    .dim { fill: #8C8C8C; }
    .a { fill: #D97757; font-weight: 700; }
    .b { fill: #7AA8F7; font-weight: 700; }
  </style>
  <rect width="760" height="344" rx="12" fill="#161616"/>

  <text x="24" y="38" class="h">Sync for lyricle: its own SQLite queue, or Firestore's offline cache?</text>
  <text x="24" y="60" class="dim">Opponent: a headless claude -p with Read, Grep and Glob, arguing Side B</text>

  <rect x="16" y="78" width="728" height="166" rx="6" fill="none" stroke="#3A3A3A"/>
  <line x1="196" y1="78" x2="196" y2="244" stroke="#3A3A3A"/>
  <line x1="460" y1="78" x2="460" y2="244" stroke="#3A3A3A"/>
  <line x1="16" y1="108" x2="744" y2="108" stroke="#3A3A3A"/>
  <line x1="16" y1="135" x2="744" y2="135" stroke="#2A2A2A"/>
  <line x1="16" y1="162" x2="744" y2="162" stroke="#2A2A2A"/>
  <line x1="16" y1="189" x2="744" y2="189" stroke="#2A2A2A"/>
  <line x1="16" y1="216" x2="744" y2="216" stroke="#2A2A2A"/>

  <text x="208" y="98" class="a">Side A: SQLite + sync queue</text>
  <text x="472" y="98" class="b">Side B: Firestore offline</text>

  <text x="28" y="126" class="dim">Core argument</text>
  <text x="208" y="126">You own conflicts and schema</text>
  <text x="472" y="126">Offline + sync + auth, day one</text>

  <text x="28" y="153" class="dim">Best for</text>
  <text x="208" y="153">Complex queries, no lock-in</text>
  <text x="472" y="153">A solo dev shipping this month</text>

  <text x="28" y="180" class="dim">Biggest risk</text>
  <text x="208" y="180">Writing and debugging sync</text>
  <text x="472" y="180">Query limits and cost at scale</text>

  <text x="28" y="207" class="dim">Cost to switch later</text>
  <text x="208" y="207">Low: the data stays yours</text>
  <text x="472" y="207">High: data shaped for Firestore</text>

  <text x="28" y="234" class="dim">Rebuttal</text>
  <text x="208" y="234">Easy until two devices conflict</text>
  <text x="472" y="234">You'd rebuild half of Firestore</text>

  <text x="24" y="276"><tspan class="h">Where they agree:</tspan> lyrics are small, writes are rare, offline is a must.</text>
  <text x="24" y="300"><tspan class="h">The deciding question:</tspan> will two devices ever edit the same lyric offline?</text>
  <text x="24" y="326" class="dim">Which side do you want to go with?</text>
</svg>
