<svg xmlns="http://www.w3.org/2000/svg" width="380" height="132" viewBox="0 0 380 132" role="img" aria-label="A Windows notification from input-notify titled Claude - lyricle, asking which date library to use">
  <style>
    text { font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif; fill: #F2F2F2; }
    .app { font-size: 12px; fill: #BDBDBD; }
    .title { font-size: 14px; font-weight: 600; }
    .body { font-size: 13.5px; fill: #D6D6D6; }
    .ctl { font-size: 14px; fill: #BDBDBD; }
  </style>
  <rect x="2" y="2" width="376" height="128" rx="10" fill="#2B2B2B" stroke="#3D3D3D"/>
  <!-- app row: Windows PowerShell -->
  <rect x="18" y="16" width="16" height="16" rx="3" fill="#2A6FD6"/>
  <path d="M22 20.5l4 3.5-4 3.5" fill="none" stroke="#FFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M27 28h4" stroke="#FFF" stroke-width="1.6" stroke-linecap="round"/>
  <text x="42" y="28.5" class="app">Windows PowerShell</text>
  <text x="326" y="28.5" class="ctl">···</text>
  <text x="352" y="29" class="ctl">✕</text>
  <!-- info icon, as the balloon shows it -->
  <circle cx="38" cy="78" r="16" fill="#3A8EE6"/>
  <rect x="36.2" y="74" width="3.6" height="13" rx="1.6" fill="#FFF"/>
  <circle cx="38" cy="68.5" r="2.3" fill="#FFF"/>
  <text x="68" y="68" class="title">Claude - lyricle</text>
  <text x="68" y="90" class="body">Which date library should we use for the</text>
  <text x="68" y="109" class="body">release notes?</text>
</svg>
